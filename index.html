<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Untuk <span class="nama">[Nama Pacar]</span> ❤️</h1>
        </header>
        
        <section class="hero">
            <div class="heart"><i class="fas fa-heart"></i></div>
            <h2>Ada sesuatu yang ingin aku tanyakan...</h2>
        </section>
        
        <section class="message">
            <p>Dari semua orang di dunia ini, kamu adalah yang paling spesial.</p>
            <p>Maukah kamu menjadi...</p>
            <p class="big-text">PACAR SAYA?</p>
        </section>
        
        <section class="choices">
            <button class="yes-btn" onclick="jawaban('iya')">
                <i class="fas fa-heart"></i> IYA! <i class="fas fa-heart"></i>
            </button>
            <button class="no-btn" onmouseover="hindariTombol(this)">
                Mungkin nanti
            </button>
        </section>
        
        <section class="gallery">
            <h3>Kenangan Kita</h3>
            <div class="photos">
                <!-- Tambahkan foto-foto kalian -->
            </div>
        </section>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
